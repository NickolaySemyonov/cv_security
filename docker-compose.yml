services:
  rabbitmq:
    image: rabbitmq:3.10.7-management
    hostname: rabbitmq
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-rmuser}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:-rmpassword}
      - RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS=-rabbit log_levels [{connection,error},{default,error}] disk_free_limit 2147483648
    ports:
      - 15672:15672
      - 5672:5672

    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 10s
      retries: 6
  
  postgres:
    image: postgres:14.21-trixie
    hostname: postgres
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-admin}
    ports:
      - "5432:5432"
    volumes:
      - ./db-init-scripts:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  cv:
    build: services/cv
    env_file:
      - services/cv/.env
    tty: true
    init: true
    depends_on:
      postgres:
        condition: service_healthy 
      rabbitmq:
        condition: service_healthy
    deploy: # GPU резервация
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all          # Все GPU 
              capabilities: [ gpu ]

  analytics:
    build: services/analytics
    env_file:
      - services/analytics/.env
    tty: true
    init: true
    depends_on:
      postgres:
        condition: service_healthy 
      rabbitmq:
        condition: service_healthy

  notifications:
    build: services/notifications
    env_file:
      - services/notifications/.env
    ports:
      - "8002:8002"
    tty: true
    init: true
    depends_on:
      postgres:
        condition: service_healthy 
      rabbitmq:
        condition: service_healthy

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    ports:
      - "8554:8554"
      - "8889:8889"
      - "8888:8888"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml
    restart: unless-stopped

volumes:
  postgres_data: